<style>
  :root {
    color-scheme: light dark;
    --paper: #FFFFFF;
    --ink: #10202E;
    --ink-soft: #3E5468;
    --rule: #D3DBE0;
    --signal: #D95708;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121A21;
      --ink: #F2F5F7;
      --ink-soft: #A9B8C4;
      --rule: #33414D;
      --signal: #FF7A26;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    font-weight: 450;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .band { height: 6px; background: var(--signal); }
  main {
    width: 100%;
    max-width: 30rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 2rem;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  header { text-align: center; }
  .headshot {
    width: 8.5rem;
    height: 8.5rem;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 1.4rem;
    border: 3px solid var(--signal);
  }
  h1 {
    font-weight: 700;
    font-size: clamp(2.1rem, 8.5vw, 2.8rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
  }
  .role {
    margin-top: 0.8rem;
    font-size: 1.1rem;
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: 24rem;
    margin-left: auto;
    margin-right: auto;
  }
  nav {
    margin-top: 2.5rem;
    border-top: 1px solid var(--rule);
  }
  nav a {
    display: block;
    padding: 1.15rem 0.25rem;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: var(--ink);
    transition: color 120ms ease, padding-left 120ms ease;
  }
  nav a:hover, nav a:focus-visible {
    color: var(--signal);
    padding-left: 0.6rem;
  }
  nav a:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }
  .link-name {
    display: block;
    font-weight: 600;
    font-size: 1.25rem;
    line-height: 1.3;
  }
  .link-note {
    display: block;
    margin-top: 0.2rem;
    font-size: 0.95rem;
    color: var(--ink-soft);
  }
  nav a:hover .link-note, nav a:focus-visible .link-note { color: inherit; }
  @media (prefers-reduced-motion: reduce) {
    nav a { transition: none; }
  }
</style>
